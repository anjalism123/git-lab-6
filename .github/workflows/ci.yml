name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify message file
        run: |
          echo "Checking message.txt"
          cat message.txt
          grep -q "Hello from CI/CD lab" message.txt